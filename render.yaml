services:
  - type: web
    name: attendance-manager
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_PATH
        value: /var/data/attendance.db
      - key: JWT_SECRET_KEY
        generateValue: true
