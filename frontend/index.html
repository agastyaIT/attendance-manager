<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Attendance Manager</title>
  <link rel="stylesheet" href="/app/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Attendance Manager</h1>
    <p class="muted">MITS Gwalior, IT Department</p>

    <div id="message" class="msg" hidden></div>

    <form id="login-form">
      <label>Email
        <input type="email" id="email" required autocomplete="username">
      </label>
      <label>Password
        <input type="password" id="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn">Log in</button>
    </form>

    <p class="muted">New student? <a href="/app/register.html">Create an account</a></p>
  </main>

  <script src="/app/js/api.js"></script>
  <script src="/app/js/auth.js"></script>
</body>
</html>
