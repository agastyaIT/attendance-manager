<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <h2>Attendance Manager</h2>
      <p id="user-name"></p>
      <p id="user-section"></p>
      <a href="dashboard.html">Dashboard</a>
      <button id="logout-btn">Log out</button>
    </div>

        <div class="main">
      <h1>My Attendance</h1>

      <div id="warnings"></div>

      <div class="cards">
        <div class="card">
          <h3>Overall attendance</h3>
          <p class="big-number" id="overall-percent">--</p>
          <p id="overall-count"></p>
          <p id="overall-message"></p>
        </div>
      </div>

      <h2>Subjects</h2>
      <div class="cards" id="subjects"></div>

      <p class="error" id="message"></p>
    </div>

  <script src="../js/api.js"></script>
  <script src="../js/student.js"></script>
</body>
</html>
