<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Attendance Manager</title>
  <link rel="stylesheet" href="/app/css/style.css">
</head>
<body class="app">
  <aside class="sidebar">
    <h2>Attendance Manager</h2>
    <nav>
      <button class="nav-btn active" data-section="users">Users</button>
      <button class="nav-btn" data-section="faculty">Add Faculty</button>
      <button class="nav-btn" data-section="subjects">Subjects</button>
      <button class="nav-btn" data-section="assignments">Assignments</button>
    </nav>
    <div class="sidebar-footer">
      <span id="whoami"></span>
      <button id="logout-btn" class="btn-link">Log out</button>
    </div>
  </aside>

  <main class="content">
    <div id="message" class="msg" hidden></div>

    <section id="section-users" class="panel">
      <h3>Users</h3>
      <label class="inline">Show
        <select id="role-filter">
          <option value="">All roles</option>
          <option value="student">Students</option>
          <option value="faculty">Faculty</option>
          <option value="admin">Admins</option>
        </select>
      </label>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Section</th><th></th></tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>

    <section id="section-faculty" class="panel" hidden>
      <h3>Add faculty account</h3>
      <form id="faculty-form" class="form-grid">
        <label>Name
          <input type="text" id="faculty-name" required>
        </label>
        <label>Email
          <input type="email" id="faculty-email" required>
        </label>
        <label>Temporary password (min 8)
          <input type="password" id="faculty-password" minlength="8" required>
        </label>
        <button class="btn" type="submit">Create faculty</button>
      </form>
    </section>

    <section id="section-subjects" class="panel" hidden>
      <h3>Subjects</h3>
      <form id="subject-form" class="form-grid">
        <label>Code
          <input type="text" id="subject-code" required>
        </label>
        <label>Name
          <input type="text" id="subject-name" required>
        </label>
        <label>Type
          <select id="subject-type">
            <option value="theory">Theory</option>
            <option value="lab">Lab</option>
            <option value="project">Project</option>
            <option value="seminar">Seminar</option>
          </select>
        </label>
        <label>Section
          <select id="subject-section">
            <option value="">Both A and B</option>
            <option value="A">A only</option>
            <option value="B">B only</option>
          </select>
        </label>
        <button class="btn" type="submit">Add subject</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Code</th><th>Name</th><th>Type</th><th>Section</th><th></th></tr>
          </thead>
          <tbody id="subjects-body"></tbody>
        </table>
      </div>
    </section>

    <section id="section-assignments" class="panel" hidden>
      <h3>Faculty assignments</h3>
      <form id="assignment-form" class="form-grid">
        <label>Faculty
          <select id="assignment-faculty"></select>
        </label>
        <label>Subject
          <select id="assignment-subject"></select>
        </label>
        <label>Section
          <select id="assignment-section">
            <option value="A">A</option>
            <option value="B">B</option>
          </select>
        </label>
        <button class="btn" type="submit">Assign</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Subject</th><th>Section</th><th>Faculty</th><th></th></tr>
          </thead>
          <tbody id="assignments-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app/js/api.js"></script>
  <script src="/app/js/admin.js"></script>
</body>
</html>
